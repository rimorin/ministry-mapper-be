{{define "content"}}
{{if .Summary.Available}}
<tr>
  <td class="em-pad" style="padding:20px 32px 0;">
    {{template "label" "In short"}}
    <p style="margin:0;font-size:16px;line-height:1.55;color:#1f2937;">{{.Summary.Overview}}</p>
  </td>
</tr>
{{end}}
<tr>
  <td class="em-pad" style="padding:24px 32px 20px;">
    {{template "label" "Notes"}}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {{range .Notes}}<tr>
        <td class="em-line" style="padding:14px 0;border-top:1px solid #e5e7eb;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
            <td style="font-size:14px;font-weight:600;color:#1f2937;">{{.Address}}</td>
            <td class="em-meta em-muted" align="right" style="font-size:12px;color:#6b7280;white-space:nowrap;">{{.Date}}{{if .Publisher}} · {{.Publisher}}{{end}}</td>
          </tr></table>
          <p style="margin:6px 0 0;font-size:15px;line-height:1.5;color:#1f2937;">{{.Message}}</p>
        </td>
      </tr>{{end}}
    </table>
  </td>
</tr>
{{end}}
