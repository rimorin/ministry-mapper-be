{{define "label"}}<p class="em-muted" style="margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;">{{.}}</p>{{end}}
{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{.Title}}</title>
<style>
  body { margin: 0; padding: 0; }
  @media only screen and (max-width: 620px) {
    .em-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .em-tile { display: block !important; width: 100% !important; box-sizing: border-box; margin-bottom: 8px !important; }
    .em-tile-sep { display: none !important; }
    .em-meta { display: block !important; text-align: left !important; padding-top: 2px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .em-bg { background-color: #0f172a !important; }
    .em-card { background-color: #1e293b !important; }
    .em-ink, .em-ink td, .em-ink p, .em-ink li, .em-ink .em-strong { color: #f3f4f6 !important; }
    .em-muted { color: #9ca3af !important; }
    .em-line { border-color: #334155 !important; }
    .em-tile { background-color: #0f172a !important; }
    .em-chip { background-color: #0f172a !important; color: #cbd5e1 !important; }
    .em-a { color: #93c5fd !important; }
    .em-button { background-color: #3b82f6 !important; }
  }
</style>
</head>
<body class="em-bg" style="margin:0;padding:0;background-color:#f4f5f7;">
{{if .Preheader}}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preheader}}</div>{{end}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="em-bg" style="background-color:#f4f5f7;">
<tr><td style="padding:24px 12px;">
<table role="presentation" class="em-card em-ink" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;background-color:#ffffff;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
<tr>
  <td class="em-pad em-line" style="padding:18px 32px;border-bottom:1px solid #e5e7eb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="font-size:13px;font-weight:600;letter-spacing:.02em;color:#1f2937;">Ministry Mapper</td>
      <td class="em-muted" align="right" style="font-size:13px;color:#6b7280;">{{.Kicker}}</td>
    </tr></table>
  </td>
</tr>
<tr>
  <td class="em-pad" style="padding:28px 32px 8px;">
    <p style="margin:0;font-size:22px;line-height:1.3;font-weight:600;color:#1f2937;">{{.Title}}</p>
    {{if .Subtitle}}<p class="em-muted" style="margin:4px 0 0;font-size:15px;color:#6b7280;">{{.Subtitle}}</p>{{end}}
  </td>
</tr>
{{template "content" .}}
{{if .ButtonURL}}<tr>
  <td class="em-pad" style="padding:8px 32px 28px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td class="em-button" style="background-color:#2563eb;border-radius:6px;">
        <a href="{{.ButtonURL}}" style="display:inline-block;padding:11px 18px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">{{.ButtonLabel}}</a>
      </td>
    </tr></table>
  </td>
</tr>{{end}}
<tr>
  <td class="em-pad em-line em-muted" style="padding:20px 32px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#6b7280;">{{.Footer}}</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>{{end}}
